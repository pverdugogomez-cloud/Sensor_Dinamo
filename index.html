<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Industrial</title>
    <!-- Tailwind CSS (CDN para desarrollo rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            900: '#0f172a',
                        },
                        electric: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-[100dvh] w-screen overflow-hidden bg-slate-50 text-slate-900 font-sans flex flex-col md:flex-row antialiased">



    <!-- Sidebar 25% -->
    <aside class="w-full md:w-1/4 h-[40vh] md:h-full bg-white border-t md:border-t-0 md:border-r border-slate-200 flex flex-col z-20 relative shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] md:shadow-xl order-2 md:order-1">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-wide">DÍNAMO<span class="text-electric-500 font-light">SYSTEMS</span></h1>
                <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Monitoreo de Activos</p>
            </div>

        </div>
        
        <div class="p-4 flex-1 overflow-y-auto" id="equipment-list">
            <!-- Loading state -->
            <div class="flex items-center justify-center h-20 text-slate-400">
                <i class="ph ph-spinner animate-spin text-2xl mr-2"></i> Cargando equipos...
            </div>
            <!-- Items se insertarán aquí dinámicamente -->
        </div>
        
        <div class="p-4 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
            <span>Estado: <span id="connection-status" class="text-amber-500 font-medium">No Conectado</span></span>

        </div>
    </aside>

    <!-- Main Panel 75% -->
    <main class="w-full md:w-3/4 h-[60vh] md:h-full relative z-10 bg-slate-100 order-1 md:order-2">
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Panel de Detalle e Interacción (Pop-up Lateral) -->
        <div id="detail-panel" class="absolute top-14 inset-x-2 bottom-2 md:inset-auto md:top-4 md:left-4 md:bottom-4 w-auto md:w-[400px] bg-white/95 backdrop-blur-md rounded-2xl border border-slate-200 shadow-2xl flex flex-col transform -translate-x-[120%] md:-translate-x-[110%] transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] z-[1000] overflow-hidden opacity-0 pointer-events-none">
            
            <div class="p-5 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-electric-500/10 text-electric-600 px-2 py-0.5 rounded text-xs font-bold tracking-wider" id="detail-status">ACTIVO</span>
                        <span class="text-xs text-slate-500 font-mono" id="detail-id">ID: ---</span>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900" id="detail-name">Seleccione Equipo</h2>
                    <p class="text-sm text-slate-500 mt-1 flex items-center gap-1"><i class="ph ph-map-pin"></i> <span id="detail-location">---</span></p>
                </div>
                <div class="flex gap-2">
                    <button id="btn-expand" class="p-2 text-slate-400 hover:text-electric-600 hover:bg-slate-100 rounded-lg transition" title="Expandir Análisis">
                        <i class="ph ph-arrows-out-simple text-lg"></i>
                    </button>
                    <button id="btn-close-detail" class="p-2 text-slate-400 hover:text-red-500 hover:bg-slate-100 rounded-lg transition" title="Cerrar Panel">
                        <i class="ph ph-x text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="p-5 flex-1 flex flex-col overflow-y-auto">
                
                <!-- Filtros y Selectores -->
                <div class="bg-slate-50 rounded-xl p-4 mb-5 border border-slate-200">
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Parámetros</h3>
                    
                    <div class="flex bg-slate-200/50 rounded-lg p-1 mb-4 border border-slate-200">
                        <button id="btn-chart-amp" class="flex-1 py-1.5 text-sm font-medium rounded-md bg-white text-slate-900 shadow-sm border border-slate-200 transition">Amperaje</button>
                        <button id="btn-chart-vol" class="flex-1 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-900 transition">Potencia (kW)</button>
                    </div>

                    <div class="flex gap-2 mb-4">
                        <button id="btn-filter-today" class="flex-1 py-1 text-xs font-medium rounded-md bg-slate-200 text-slate-700 hover:bg-electric-500 hover:text-white transition">Hoy</button>
                        <button id="btn-filter-yesterday" class="flex-1 py-1 text-xs font-medium rounded-md bg-slate-200 text-slate-700 hover:bg-electric-500 hover:text-white transition">Ayer</button>
                        <button id="btn-filter-week" class="flex-1 py-1 text-xs font-medium rounded-md bg-slate-200 text-slate-700 hover:bg-electric-500 hover:text-white transition">7 Días</button>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1 relative">
                            <i class="ph ph-calendar-blank absolute left-2 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="date" id="date-from" class="w-full bg-white border border-slate-200 rounded-lg pl-8 pr-2 py-1.5 text-xs text-slate-700 focus:ring-1 focus:ring-electric-500 outline-none">
                        </div>
                        <span class="text-slate-400">-</span>
                        <div class="flex-1 relative">
                            <i class="ph ph-calendar-blank absolute left-2 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="date" id="date-to" class="w-full bg-white border border-slate-200 rounded-lg pl-8 pr-2 py-1.5 text-xs text-slate-700 focus:ring-1 focus:ring-electric-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Gráfico -->
                <div class="flex-1 relative min-h-[200px] w-full">
                    <canvas id="consumptionChart"></canvas>
                </div>

                <!-- Stats rápidos -->
                <div class="grid grid-cols-2 gap-3 mt-5">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
                        <p class="text-xs text-slate-500 mb-1">Promedio</p>
                        <p class="text-xl font-bold text-slate-900"><span id="stat-avg">0</span> <span class="text-xs font-normal text-slate-500" id="stat-unit">A</span></p>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
                        <p class="text-xs text-slate-500 mb-1">Pico Máximo</p>
                        <p class="text-xl font-bold text-slate-900"><span id="stat-max">0</span> <span class="text-xs font-normal text-slate-500" id="stat-unit-2">A</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Expandido (Analítico) -->
    <div id="expanded-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[2000] hidden flex-col transition-opacity duration-300 opacity-0">
        <div class="p-4 md:p-6 border-b border-white/10 flex justify-between items-center bg-white shadow-sm">
            <h2 class="text-lg md:text-2xl font-bold text-slate-900 flex items-center gap-2 md:gap-3">
                <i class="ph ph-chart-line-up text-electric-600"></i>
                <span class="truncate">Análisis Detallado <span id="expanded-title" class="text-slate-500 font-light"></span></span>
            </h2>
            <button id="btn-close-expanded" class="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition shrink-0">
                <i class="ph ph-x text-xl md:text-2xl"></i>
            </button>
        </div>
        <div class="flex-1 p-2 md:p-8 w-full max-w-7xl mx-auto flex flex-col min-h-0">
             <div class="flex-1 relative w-full bg-white border border-slate-200 rounded-xl md:rounded-2xl p-2 md:p-6 shadow-2xl overflow-hidden">
                 <canvas id="expandedChart"></canvas>
             </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
